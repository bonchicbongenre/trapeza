<script>
// Lengths are in units of a foot's reach from the table's centre (taken as 40 cm).
const{PI:P,sin,cos,abs,hypot,min,max,round,exp,sqrt,pow,atan2,random}=Math,fl=Math.floor,
  $=i=>document.getElementById(i),c=$("c"),x=c.getContext("2d"),col={},C=k=>col["--"+k],

// the world's step, in milliseconds of the page's clock
const STEP=1000/240;

// Floors. Each is continuous, which is all the theorem asks of a floor. Each is given as its
// height with its slope both ways, [h, dh/du, dh/dv], exactly; f is the height alone, f.g
// the three.
const rnd=a=>(random()*2-1)*a,floor=g=>Object.assign((u,v)=>g(u,v)[0],{g}),
  gauss=(k,a,w)=>{const b=Array.from({length:k},()=>[rnd(1.6),rnd(1.6),rnd(a),w[0]+random()*w[1]]);

    ()=>{const w=Array.from({length:3},()=>{const a=random()*2*P;return[cos(a),sin(a),2+random()*3,random()*2*P,.02+random()*.025]});
      return floor((u,v)=>{let h=0,x=0,y=0;for(const q of w){const t=q[2]*(u*q[0]+v*q[1])+q[3],d=q[4]*q[2]*cos(t);h+=q[4]*sin(t);x+=d*q[0];y+=d*q[1]}return[h,x,y]})},

// the floor and holds the centre. Four legs (and often six) have two, and it rocks
// between them; between two resting planes no foot goes below the floor.
function rests(p,h){const out=[];
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++)for(let k=j+1;k<n;k++){
    const A=p[i],B=p[j],G=p[k],D=(B[0]-A[0])*(G[1]-A[1])-(G[0]-A[0])*(B[1]-A[1]);if(abs(D)<1e-12)continue;

// the family before it, the marbles in the third (one end of it on the table, the other

// and spaghetti pale gold, in a dark room too.

    col["--"+t]=v;col["--"+t+"#"]=v.match(/\d+/g).map(Number)}

  // the meatball -- its glazes as the house defines them by day, read from its :root

// round it -- by day that glaze's base; by night, when the washes are dark and the bases
// light, its wash two thirds of the way to the paper.

// The drawing is seen whole on the first screen. Wide: the two elevations stacked
// beside the plan, sized to the window's height too. Narrow: side by side beneath
// it. W is the plan's side; E an elevation's width.
function size(){dpr=devicePixelRatio||1;const A=c.parentNode.clientWidth;wide=A>=648;
  if(wide){W=max(300,min(A/1.8,innerHeight-280));E=.76*W;CW=round(W+32+E);CH=round(W)}
  else{W=A;E=(W-24)/2;CW=W;CH=round(W*1.52)}

// The outline of a set of points (Andrew's monotone chain).
function hull(pts){pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),
    half=list=>{const out=[];for(const q of list){while(out.length>1&&cr(out[out.length-2],out[out.length-1],q)<=0)out.pop();out.push(q)}return out.slice(0,-1)};

// high side, deeper and more opaque toward the low side, deeper with steeper tilt.

  return{u:g>1e-9?[plane[0]/g,plane[1]/g]:[1,0],hi:[...C("amber-wash#"),.45],lo:[...C("amber-base#"),.3+min(.45,g*12)]}}
// A flat piece of the table seen from the side, painted as the plan paints the top: from
// where three of its points fall and the ramp's value at each (0 high, 1 low), the canvas
// gradient that gives every point its plan colour, over the paper, `deeper` more opaque.

    over=c=>"rgb("+paper.map((v,i)=>round(v*(1-min(1,c[3]+deeper))+c[i]*min(1,c[3]+deeper)))+")",

// An elevation: a camera on the table's own axis, so it turns with the table. The
// drawing runs along e; the camera looks along d from its far side, within its frame.
// All is projected from where it is: the top a slab, drawn first; then back to front
// the floor's section at each foot's depth, the legs (round, perpendicular to the top),
// and the bodies and pools, each kept behind whatever part of the slab is nearer than it.

    // The hole, seen only from the front: while no section of the ground lies nearer the

    // straight down from the floor's edge to its bottom, drawn at its true depth under the
    // drawn floor, as what rests on it is, is drawn first, dark, and no section of the ground
    // is drawn over it; what stands above the floor, a leg or a body, is drawn over it
    // whatever its depth, and what is down it, in it. As a section comes in front of it, the

  for(const d of balls){const w=d.off&&!d.z&&!liesOn(d)&&!inHole(d);d.sv=max(0,min(1,(d.sv||0)+(w?ds:-ds)))}
  for(const q of pools)if(!q.on)q.sv=min(1,q.sv+ds);
  if(wide){elevation(p,plane,ea,W+32,.52*E+.01*W,E,"a");elevation(p,plane,eb,W+32,W/2+.52*E+.01*W,E,"b")}
  else{elevation(p,plane,ea,0,W*1.4,E,"a");elevation(p,plane,eb,E+24,W*1.4,E,"b")}
  const down=inHole,
    on=balls.filter(d=>!d.off),still=balls.filter(d=>d.off&&d.z&&!down(d)).length,loose=balls.filter(d=>d.off&&!d.z&&!down(d)).length,
    cracked=balls.filter(d=>d.cracks.length).length,broke=pools.length,
    names=[["marble","marbles"],["egg","eggs"],["meatball","meatballs"],["plate of spaghetti","plates of spaghetti"]],
    tally=l=>{const w=names.map((nm,k)=>{const c=l.filter(d=>d.k==k).length;return c&&c+" "+nm[c>1?1:0]}).filter(Boolean);
      return w.length>1?w.slice(0,-1).join(", ")+" and "+w[w.length-1]:w[0]},
    state=(!up?"It is still.":R.length>1&&b!==a?"It rocks.":up===1?"One foot is in the air.":up+" feet are in the air.")+
      (sneeze&&sim-sneeze.t0<2500?" Somebody sneezed.":"")+
      (on.length?" "+tally(on)+(on.length>1?" are":" is")+" on the table.":"")+(loose?" "+loose+" rolling on the floor.":"")+
      (still?" "+still+(still>1?" rest":" rests")+" in a hollow.":"")+(holed?" "+holed+" went down the hole.":"")+(gone?" "+gone+" rolled away.":"")+
      (door?" "+door+(door>1?" meatballs":" meatball")+" rolled out the door.":"")+
      (broke?" "+broke+(broke>1?" eggs broke.":" egg broke."):"")+(cracked?" "+cracked+(cracked>1?" eggs are cracked.":" egg is cracked."):""),
    // the label says what is here, and, once there is any, the count
    one=["a marble","an egg","a meatball","a plate of spaghetti"],
    here=[...names.map((nm,k)=>{const c=balls.filter(d=>d.k==k).length;return c&&(c>1?c+" "+nm[1]:one[k])}).filter(Boolean),...(broke?[broke>1?broke+" broken eggs":"a broken egg"]:[])],
    what="a table, a floor"+(hole?", a hole":"")+(here.length?", "+(here.length>1?here.slice(0,-1).join(", ")+" and "+here[here.length-1]:here[0]):""),
    score=[holed?holed+" in the hole.":"",door?door+(door>1?" meatballs":" meatball")+" out the door.":""].filter(Boolean).join(" ");
  if(state!==said)$("s").textContent=said=state;
  if(what!==saidWhat)$("what").textContent=saidWhat=what;
  if(score!==saidScore){const t_=$("tally");t_.textContent=saidScore=score;t_.hidden=!score}
  // a change of theme: the drawing as it was, laid over the new one and let go
  if(old){const k=(wall-t0)/500;if(k>=1||old.width!=c.width||old.height!=c.height)old=null;
    else{x.setTransform(1,0,0,1,0,0);x.globalAlpha=1-ease(k);x.drawImage(old,0,0);x.globalAlpha=1}}
  // when nothing moves -- no lean, no turn, nothing awake, no sneeze to come or going, no
  // spreading, no fade -- the page rests, and draws nothing, until something wakes it
  if(drag!==null||abs(to-th)>1e-4||R.length>1&&!calm||old||balls.some(d=>!d.z||d.at)||sneeze||pools.some(q=>q.live||sim-q.t0<1500)||hole&&sim-hole.t0<1000)requestAnimationFrame(draw);
  else asleep=true}
function wake(){if(asleep){asleep=false;requestAnimationFrame(draw)}}
// the curve the page's own colours fade along, CSS's "ease": cubic-bezier(.25,.1,.25,1)
function ease(k){let a=0,b=1,s;for(let i=0;i<20;i++){s=(a+b)/2;.75*s*(1-s)+s*s*s<k?a=s:b=s}return s*(.3*(1-s)*(1-s)+3*s*(1-s)+s*s)}

const ang=e=>{const r=c.getBoundingClientRect();return atan2(r.top+W/2-e.clientY,e.clientX-r.left-W/2)},
  legs=document.querySelectorAll("#legs button");
// from above, dragging turns the table round its middle; from a leg, sideways
c.onpointerdown=e=>{drag=view?e.clientX:ang(e);press=[e.clientX,e.clientY,e.timeStamp];c.setPointerCapture(e.pointerId);wake()};
c.onpointermove=e=>{if(drag===null)return;if(view){to+=(e.clientX-drag)*2/W;drag=e.clientX;return}const a=ang(e),d=a-drag;to+=(d+3*P)%(2*P)-P;drag=a};
// a click (barely moved, quickly let go) drops a marble just there: from above, where it
// is clicked; from a leg, where the eye's ray through it meets the top's underside (it is
// laid on the top above) or the floor
c.onpointerup=e=>{const r=c.getBoundingClientRect(),X=e.clientX-r.left,Y=e.clientY-r.top;
  if(press&&hypot(e.clientX-press[0],e.clientY-press[1])<5&&e.timeStamp-press[2]<400&&X<W&&Y<W){
    if(!view)drop((X-W/2)/(W/3.2),(W/2-Y)/(W/3.2));
    else{const V=lookout(),d=unit(add(V.F,add(mul(V.R,(X-W/2)/V.f),mul(V.U,(W/2-Y)/V.f)))),e_=toF(tp.M,sub(V.E,tp.O)),dt=toF(tp.M,d);
      const t=dt[2]>0?(.6-e_[2])/dt[2]:-1,q=add(e_,mul(dt,t));
      if(t>0&&onTop(q[0],q[1]))lay(q[0],q[1],1);
      else{let a=0,b=0;for(let s_=.01;s_<8;s_+=.01){const Q=add(V.E,mul(d,s_));if(Q[2]<f(Q[0],Q[1])){a=s_-.01;b=s_;break}}
        if(b){for(let i=0;i<30;i++){const m=(a+b)/2,Q=add(V.E,mul(d,m));Q[2]<f(Q[0],Q[1])?b=m:a=m}const Q=add(V.E,mul(d,a));if(abs(Q[0])<=1.6&&abs(Q[1])<=1.6)lay(Q[0],Q[1],0)}}}}
  drag=press=null};
c.onpointercancel=()=>{drag=press=null};
c.onkeydown=e=>{const r={ArrowLeft:1,ArrowUp:1,ArrowRight:-1,ArrowDown:-1}[e.key];if(r){to+=r*P/360;e.preventDefault();wake()}};
legs.forEach(btn=>btn.onclick=()=>{n=+btn.textContent;legs.forEach(o=>o.setAttribute("aria-pressed",o===btn));carry();wake()});
$("again").onclick=another;
// the flip: from above, the room's frame; from a leg, the table's
const VB=$("view");VB.onclick=()=>{view=1-view;VB.textContent=view?"from above":"from a leg";wake()};VB.hidden=false;
// the button lays one somewhere on the top
$("marble").onclick=()=>{const a=random()*2*P,r=sqrt(random())*.9*1.12*cos(P/n);lay(r*cos(a),r*sin(a),1)};
addEventListener("resize",()=>{size();wake()});
another();size();requestAnimationFrame(draw);

// theme: the system's, until the visitor turns it; nothing is kept. It fades over half
// a second, as the house's colours do: the drawing keeps a copy of itself to fade from.
const sys=matchMedia("(prefers-color-scheme: dark)"),T=$("theme");let theme;
const dark=()=>theme?theme=="dark":sys.matches,turn=()=>T.textContent=dark()?"light":"dark",
  recolour=()=>{old=document.createElement("canvas");old.width=c.width;old.height=c.height;
    old.getContext("2d").drawImage(c,0,0);t0=performance.now();colours();paint();wake()};
sys.addEventListener("change",()=>{if(!theme){turn();recolour()}});
T.onclick=()=>{document.documentElement.dataset.theme=theme=dark()?"light":"dark";turn();recolour()};
turn();T.hidden=false;
// glaze: celadon, then jun, then tenmoku, and round again; the dot wears the floor to come
const D=$("glaze"),tint=()=>D.setAttribute("aria-label",["celadon","jun","tenmoku"][(g+1)%3]);
D.onclick=()=>{g=(g+1)%3;tint();recolour()};
tint();D.hidden=false;

// the page's own size: it asks for itself and counts what comes back (a browser may
// report only the compressed size)
fetch(location.pathname).then(r=>r.arrayBuffer()).then(b=>$("self").textContent=b.byteLength.toLocaleString("en-US"));
console.log(String.fromCharCode(964,961,940,960,949,950,945)+": four-footed.");
</script>
